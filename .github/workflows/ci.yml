name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1"
          elixir-version: "1.19.0"

      - name: Resolve dependencies
        run: mix deps.get

      - name: Project pinned Planning Center OpenAPI with ggen_igniter
        run: mix ash_planning_center.generate

      - name: Verify generated Ash projection is committed
        run: git diff --exit-code -- lib/ash_planning_center/generated/people/person.ex

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix test

      - name: Preserve ggen_igniter reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ggen-igniter-evidence
          path: .ggen_igniter/
          if-no-files-found: ignore
